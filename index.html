<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sudha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- INTRO — blank screen, typed line, then the site opens -->
  <section id="intro">
    <p id="intro-line"><span id="typed"></span><span id="cursor">|</span></p>
  </section>

  <!-- MAIN SITE -->
  <main id="site">

    <!-- Black header with one featured quote -->
    <header class="hero">
      <div class="hero-petals" aria-hidden="true"></div>
      <p class="hero-eyebrow">Sudha</p>
      <p class="hero-quote" id="hero-quote"></p>
    </header>

    <!-- First alternating photo / quote block -->
    <section class="frame-block" aria-label="Photos and quotes">
      <div class="frame" id="frame-1"></div>
    </section>

    <!-- Second alternating photo / quote block -->
    <section class="frame-block" aria-label="More photos and quotes">
      <div class="frame" id="frame-2"></div>
    </section>

    <!-- Background music -->
    <audio id="bg-music" loop preload="none"></audio>
    <button id="music-toggle" aria-label="Play music" aria-pressed="false">
      <svg id="music-icon-note" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 18V5l12-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zm12-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></svg>
      <svg id="music-icon-pause" viewBox="0 0 24 24" width="18" height="18" hidden><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>

    <!-- Letter CTA -->
    <section class="letter-cta">
      <a href="letter.html" class="envelope-link">
        <span class="envelope" aria-hidden="true">
          <svg viewBox="0 0 48 32" width="48" height="32">
            <rect x="1" y="1" width="46" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M2 3 L24 20 L46 3" fill="none" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </span>
        <span class="envelope-text">A small letter for you</span>
      </a>
    </section>

  </main>

  <footer>
    <p>With all my love for my  Sudha.</p>
  </footer>

  <script src="photos.js"></script>
  <script src="quotes.js"></script>
  <script src="music.js"></script>
  <script src="script.js"></script>
</body>
</html>
